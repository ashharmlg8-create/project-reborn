name: Reborn V4 Domain Tests
on:
  push:
    branches:
      - reborn-companion-v4-alpha
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run domain tests
        run: npm test
